seed: 42

domain: {lat_min: 39.0, lat_max: 46.5, lon_min: 12.0, lon_max: 20.0, height: 31, width: 33}

data:
  era5_root: ../DownloadDate
  training_cache: cache/stormengine_2010_2017
  cache_identity: data/manifests/v7_cache_identity_2010_2017.json
  station_registry: data/stations_registry.csv
  static_fields: data/static/adriatic_physical_239_fields.npz
  # Operationally compatible ERA5 proxy channels. Station pressure is excluded:
  # raw B10004 pressure must not be relabelled as ERA5 mean-sea-level pressure.
  input_variables: [u10, v10, i10fg, t2m, tp]
  target_variables: [msl, u10, v10, t2m, tp]
  history_hours: 12
  forecast_hours: 6
  window_stride_hours: 1
  train_years: [2010, 2011, 2012]
  validation_years: [2016]
  test_years: [2017]

model:
  include_age: true
  point_hidden: 64
  latent_channels: 64
  processor_layers: 2
  kernel_size: 3
  gaussian_sigma: 0.10
  static_channels: 2
  point_static_channels: 2

missingness:
  empirical_tensor: data_external/meteohub/processed/20260801_20260808/official_hourly_physical.npz
  empirical_manifest: data/manifests/v7_dpc_mask_profile_20260801_20260808.json
  use_real_templates_for_training: false
  use_real_templates_for_validation: false
  # Generic random training corruption; it does not depend on specific station IDs.
  variable_dropout: {}
  variable_dropout_range: [0.0, 0.4]
  station_dropout: 0.0
  station_dropout_range: [0.0, 0.2]
  network_outage_probability: 0.1
  outage_duration_hours: [1, 12]
  time_block_probability: 0.0
  time_block_hours: 3
  age_60_probability: 0.01

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  mixed_precision: true
  num_workers: 0
  sea_weight: 2.0
  smoke_train_batches: 10
  smoke_validation_batches: 5
  benchmark_warmup_batches: 10
  benchmark_batches: 200
  pilot_epochs: 5
  pilot_train_batches: 300
  pilot_validation_batches: 75
  early_stopping_patience: 3
  output_dir: artifacts/v7_a1_dev
