seed: 42

domain:
  lat_min: 39.0
  lat_max: 46.5
  lon_min: 12.0
  lon_max: 20.0
  height: 31
  width: 33

data:
  era5_root: ../DownloadDate
  era5_manifest: data/manifests/era5_manifest.csv
  station_registry: data/stations_registry.csv
  station_profile: dpc_plus_sea
  normalization_stats: data/normalization/pilot_2010.json
  static_fields: data/static/pilot_390_fields.npz
  input_variables: [msl, u10, v10, i10fg, t2m]
  target_variables: [msl, u10, v10, t2m, tp]
  history_hours: 12
  forecast_hours: 6
  window_stride_hours: 1
  cache_months: 12
  train_years: [2010]
  validation_years: [2011]
  test_years: [2012]

model:
  point_hidden: 64
  latent_channels: 64
  processor_layers: 2
  kernel_size: 3
  gaussian_sigma: 0.10
  static_channels: 2
  point_static_channels: 2

training:
  batch_size: 8
  epochs: 80
  learning_rate: 0.0001
  weight_decay: 0.0001
  station_dropout: 0.20
  gradient_clip: 1.0
  mixed_precision: true
  num_workers: 0
  sea_weight: 2.0
  early_stopping_patience: 12
  lr_scheduler_patience: 5
  lr_scheduler_factor: 0.5
  output_dir: artifacts/v6_pilot
