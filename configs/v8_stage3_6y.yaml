extends: v7_b.yaml

experiment: V8-Stage3-Six-Year-Gradual-Unfreezing-Seed42
seed: 42

# Stage 3 uses the validated full cache. Structure selection is finished, so
# the retained model is now optimized on all 2010--2015 development years.
data:
  window_stride_hours: 3
  train_years: [2010, 2011, 2012, 2013, 2014, 2015]
  validation_years: [2016]
  test_years: [2017]

model:
  point_hidden: 64
  latent_channels: 96
  gaussian_sigma: 0.10
  processor_layers: 3
  kernel_size: 3

stage3:
  batch_size: 8
  max_reconstruction_degradation_percent: 3.0
  smoke_train_batches: 2
  smoke_validation_batches: 1
  smoke_reconstruction_batches: 1
  pilot_epochs: 2
  pilot_train_batches: 200
  pilot_validation_batches: 50
  pilot_reconstruction_batches: 50

  stage3a:
    source_checkpoint: artifacts/v8_stage2_dev3y_ph064_lat096_seed42/best.pt
    output_dir: artifacts/v8_stage3a_6y_ph064_lat096_seed42
    processor_learning_rate: 0.00005
    decoder_learning_rate: 0.00001
    max_epochs: 10
    early_stopping_patience: 4
    lr_scheduler_patience: 2
    lr_scheduler_factor: 0.5

  stage3b:
    source_checkpoint: artifacts/v8_stage3a_6y_ph064_lat096_seed42/best.pt
    output_dir: artifacts/v8_stage3b_6y_ph064_lat096_seed42
    encoder_learning_rate: 0.000005
    processor_learning_rate: 0.00003
    decoder_learning_rate: 0.00001
    max_epochs: 60
    early_stopping_patience: 10
    lr_scheduler_patience: 5
    lr_scheduler_factor: 0.5
