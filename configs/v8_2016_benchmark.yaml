  sparse_persistence_note: Stage-2 Encoder-Decoder current-grid reconstruction from the same sparse input, repeated to all six leads

events:
  strong_wind_quantile: 0.95
  wet_precipitation_minimum_mm: 0.1
  wet_precipitation_quantile: 0.95
  fixed_precipitation_threshold_mm: 5.0
  low_msl_quantile: 0.05

acceptance:
  minimum_positive_wind_leads_per_component: 4
  maximum_reconstruction_degradation_percent: 3.0

evaluation:
  batch_size: 8
  progress_every_batches: 50
  output_dir: artifacts/v8_2016_benchmark
