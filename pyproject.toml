[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stormengine-dl"
version = "0.1.0"
description = "Sparse-station to gridded short-range Adriatic weather forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "PyYAML>=6.0",
  "shapely>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
